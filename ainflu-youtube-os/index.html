<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070712"><meta name="description" content="TubeFlow AI — plataforma unificada para pesquisa, criação, produção, distribuição e análise de conteúdo"><title>TubeFlow AI — Unified Creator OS</title><style>html,body{margin:0;min-height:100%;background:#070712;color:#f7f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center;background:radial-gradient(circle at 35% 25%,rgba(22,217,227,.12),transparent 30%),radial-gradient(circle at 70% 70%,rgba(255,45,170,.12),transparent 34%),#070712}.logo{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-.04em}.logo span{background:linear-gradient(90deg,#16d9e3,#7c3aed,#ff2daa);-webkit-background-clip:text;background-clip:text;color:transparent}.ring{width:52px;height:52px;margin:24px auto;border:4px solid #24243d;border-top-color:#16d9e3;border-right-color:#ff2daa;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}small{display:block;color:#9b9bb4;line-height:1.5}.error{max-width:680px;border:1px solid #31314f;border-radius:20px;padding:28px;background:#111124}.error code{display:block;margin-top:14px;color:#16d9e3;overflow-wrap:anywhere}</style></head><body><div class="boot"><div><div class="logo"><span>TubeFlow</span> AI</div><div class="ring"></div><small>Inicializando o Unified Creator OS…<br>Pesquisa, NotebookLM, roteiro, storyboard, produtos, publicação e analytics.</small></div></div><script>(async()=>{try{const base="https://raw.githubusercontent.com/jfs195805-alt/-bi-decision-insights-portfolio/main/ainflu-youtube-os/";const files=["tf0.txt","tf1.txt","tf2.txt","tf3.txt","tf4.txt"];const payload=(await Promise.all(files.map(async file=>{const response=await fetch(base+file,{cache:"no-store"});if(!response.ok)throw new Error(`Falha ao carregar ${file}: HTTP ${response.status}`);return response.text()}))).join("").replace(/\s+/g,"");const compressed=Uint8Array.from(atob(payload),char=>char.charCodeAt(0));const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"))).text();if(!html.includes("<html")||!html.includes("TubeFlow"))throw new Error("Pacote da aplicação inválido");document.open();document.write(html);document.close()}catch(error){document.body.innerHTML=`<div class="boot"><div class="error"><div class="logo"><span>TubeFlow</span> AI</div><h2>Não foi possível iniciar a aplicação</h2><small>Atualize a página. Se a falha continuar, o pacote de produção precisa ser revisado.</small><code>${String(error.message).replace(/[<>&]/g,"")}</code></div></div>`}})();</script></body></html>
