<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070712"><title>Ainflu YouTube OS</title><style>html,body{height:100%;margin:0;background:#070712;color:#f7f7ff;font-family:system-ui}.b{height:100%;display:grid;place-items:center;text-align:center}.l{font-size:28px;font-weight:900}.l span{background:linear-gradient(90deg,#16d9e3,#7c3aed,#ff2daa);-webkit-background-clip:text;color:transparent}.s{width:34px;height:34px;margin:20px auto;border:3px solid #282846;border-top-color:#16d9e3;border-radius:50%;animation:x .8s linear infinite}@keyframes x{to{transform:rotate(360deg)}}small{color:#9b9bb4}</style></head><body><div class="b"><div><div class="l"><span>Ainflu</span> YouTube OS</div><div class="s"></div><small>Inicializando Creative Automation Control Center…</small></div></div><script>(async()=>{try{let b=(await Promise.all(['ghc0.txt','ghc1.txt','ghc2a.txt','ghc2b.txt','ghc2c.txt','ghc2d.txt','ghc2e.txt'].map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha '+x);return r.text()})))).join(''),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="b"><div><div class="l"><span>Ainflu</span> YouTube OS</div><p>Falha ao iniciar.</p><small>'+e+'</small></div></div>'}})()</script></body></html>
